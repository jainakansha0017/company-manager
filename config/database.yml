# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
#
# Ensure the pg gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Left unset by default so local connections go over the Unix socket and are
  # authenticated as the current OS user. Set these in .env to connect over TCP.
  username: <%= ENV["COMPANY_MANAGER_DATABASE_USERNAME"] %>
  password: <%= ENV["COMPANY_MANAGER_DATABASE_PASSWORD"] %>
  host: <%= ENV["COMPANY_MANAGER_DATABASE_HOST"] %>

development:
  <<: *default
  database: company_manager_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: company_manager_test

# The database lives on Neon, which hands you a single connection string. Fetch
# it rather than relying on Rails merging DATABASE_URL over the settings above:
# when it is unset, that merge leaves the defaults in place, those point at a
# local Unix socket, and the deploy fails with "is the server running locally?"
# instead of saying which environment variable is missing.
#
# The fetch is guarded because Rails renders every environment's block through
# ERB whatever environment you are in, so an unguarded fetch would stop `rails
# console` from booting in development too.
#
# `sslmode` is forced to verify-full here rather than left to the string pasted
# into the Render dashboard. Neon's own copy-paste connection string ends in
# `?sslmode=require`, and require encrypts without checking who is on the other
# end — it will hand the database password to anyone who can answer to Neon's
# hostname. verify-full checks the certificate and the hostname on it.
#
# Rewriting the query string is what it takes: where a setting appears both in
# the URL and as a key in this block, the URL wins, so a `sslmode:` key here
# would be quietly overridden by the `require` already in the pasted string.
# Doing it in the URL also means the guarantee lives in version control instead
# of depending on an environment variable being typed correctly.
#
# `sslrootcert` says which authorities to trust. libpq otherwise looks for
# ~/.postgresql/root.crt, which does not exist on the deploy, and verify-full
# fails closed without it. Neon's certificates come from Let's Encrypt, whose
# ISRG roots are in the distribution's bundle. `system` would say the same in
# less space but needs libpq 16 or newer, and the path works on any version.
<%
  database_url = Rails.env.production? ? ENV.fetch("DATABASE_URL") : ENV["DATABASE_URL"]

  if database_url
    uri = URI.parse(database_url)
    settings = URI.decode_www_form(uri.query.to_s)
                  .reject { |name, _| %w[sslmode sslrootcert].include?(name) }
    settings << ["sslmode", "verify-full"]
    settings << ["sslrootcert", "/etc/ssl/certs/ca-certificates.crt"]
    uri.query = URI.encode_www_form(settings)
    database_url = uri.to_s
  end
%>
production:
  url: <%= database_url %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
