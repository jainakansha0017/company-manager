# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
#
# Ensure the pg gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # Left unset by default so local connections go over the Unix socket and are
  # authenticated as the current OS user. Set these in .env to connect over TCP.
  username: <%= ENV["COMPANY_MANAGER_DATABASE_USERNAME"] %>
  password: <%= ENV["COMPANY_MANAGER_DATABASE_PASSWORD"] %>
  host: <%= ENV["COMPANY_MANAGER_DATABASE_HOST"] %>

development:
  <<: *default
  database: company_manager_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: company_manager_test

# Render (and most hosts) hand you a single connection string. Rails merges
# DATABASE_URL over whatever is written here, so production needs nothing else.
production:
  <<: *default
  database: company_manager_production
