# Render blueprint. Create the service from this file with
# Dashboard -> New -> Blueprint, pointed at this repository.
#
# The database is deliberately not declared here. Render allows only one free
# Postgres per workspace and that one is already spoken for, so the database
# lives on Neon instead and arrives as a DATABASE_URL you paste in. Neon's free
# tier also has no 30-day expiry, which Render's does.
services:
  - type: web
    name: company-manager
    runtime: ruby
    plan: free
    region: singapore
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /
    envVars:
      # Neon's pooled connection string, copied from its dashboard. Keep the
      # ?sslmode=require on the end; Neon refuses plaintext connections.
      - key: DATABASE_URL
        sync: false
      # Decrypts config/credentials.yml.enc, which is where secret_key_base
      # lives. Not in this file: paste config/master.key into the dashboard.
      - key: RAILS_MASTER_KEY
        sync: false
      # Without this Puma forks one worker per CPU and the free instance runs
      # out of memory on boot.
      - key: WEB_CONCURRENCY
        value: 2
      - key: RAILS_ENV
        value: production
